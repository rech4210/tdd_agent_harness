name: Harness Quality Gates

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  gates:
    name: Run Harness Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 프로젝트별 의존성 설치 자리 (프로젝트 언어 및 패키지 관리자에 맞게 주석을 해제하여 사용)
      # - name: Install project dependencies
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install -r requirements.txt

      - name: Determine base commit
        id: base-commit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
            fi
            echo "base=$BEFORE" >> "$GITHUB_OUTPUT"
          fi

      - name: Run harness gates
        run: |
          python harness/run_gates.py --role implementer --base "${{ steps.base-commit.outputs.base }}"

      - name: Verify gate evidence
        run: |
          python harness/evidence.py check --sha "${{ github.sha }}"
