# 슬라이스별 역할 배정 (프로젝트 소유, 사람만 고친다: H10).
#
# 규칙
# - 배정은 슬라이스 경계에서만 바꾼다. 슬라이스가 진행 중이면 그 슬라이스의 배정은 고치지 않는다.
# - 바꿀 때는 reason 에 이유(토큰 · 성능 · 실험 목적)를 남긴다.
# - 역할을 쓰지 않은 슬라이스는 그 키를 생략한다.
# - 에이전트 이름은 config/agents.toml 에 등록되어 있어야 한다.
# - 검사: harness/check_assignments.py (게이트 GA). roles.toml [separation] 을 어기면 실패한다.
# - 작업 지시서(work_orders/*.md) 머리말의 agent 는 이 표와 같아야 한다 (같은 검사가 확인한다).
#
# 예:
# [slice.WO-01]
# status = "open"            # open | closed
# test_author = "claude"
# implementer = "codex"
# mutation_auditor = "gemini"
# reason = "첫 슬라이스. 구현 품질을 가장 신뢰하는 계열을 구현자로"
